# Requirements: requirements.txt + multi_agents/requirements.txt, as the project's Dockerfile installs them.
# Every service imports gpt_researcher (directly or through multi_agents/__init__.py), so all share one list.
agents:
  - name: GPTResearcher
    entrypoint: backend/server/canyonos_gpt_researcher.py
    replicas: 1
    requirements: &agent_requirements
      - "fastapi>=0.104.1"
      - "uvicorn>=0.24.0.post1"
      - "pydantic>=2.5.1"
      - "python-dotenv>=1.0.0"
      - "langchain>=1.0.0"
      - "langchain-classic>=1.0.0"
      - "langchain-community>=0.4.0"
      - "langchain-core>=1.0.0"
      - "langchain-ollama>=1.0.0"
      - "langchain-openai>=1.0.0"
      - "langchain-text-splitters>=1.0.0"
      - "langgraph>=0.2.76"
      - "openai>=1.3.3"
      - "ollama>=0.4.8"
      - "litellm>=1.71.0"
      - "google-genai>=1.0.0"
      - "tavily-python>=0.7.12"
      - "ddgs>=9.0.0"
      - "arxiv>=2.0.0"
      - "beautifulsoup4>=4.12.2"
      - "brotli>=1.2.0"
      - "pymupdf>=1.23.6"
      - "python-docx>=1.1.0"
      - "python-pptx>=1.0.2"
      - "unstructured>=0.13"
      - "lxml>=4.9.2"
      - "pandas>=2.0.0"
      - "tiktoken>=0.7.0"
      - "numpy>=2.0.0,<2.5.0"
      - "aiofiles>=23.2.1"
      - "httpx>=0.28.1"
      - "websockets>=13.1"
      - "requests>=2.31.0"
      - "pyyaml>=6.0.1"
      - "jinja2>=3.1.6"
      - "loguru>=0.7.2"
      - "colorama>=0.4.6"
      - "md2pdf>=1.0.1"
      - "mistune>=3.0.2"
      - "htmldocx>=0.0.6"
      - "mcp>=1.9.1,<2.0.0"
      - "langchain-mcp-adapters>=0.1.0"
      - "sqlalchemy>=2.0.28"
      - "python-multipart>=0.0.6"
      - "json-repair>=0.29.8"
      - "json5>=0.9.25"
      - "markdown>=3.5.1"
      - "langgraph-cli"
      - "weasyprint"
    functions:
      - name: run
        arguments:
          - name: task
            type: str
          - name: report_type
            type: str
          - name: report_source
            type: str
          - name: tone
            type: str
          - name: source_urls
            type: list
          - name: document_urls
            type: list
          - name: query_domains
            type: list
          - name: headers
            type: dict
          - name: mcp_enabled
            type: bool
          - name: mcp_strategy
            type: str
          - name: mcp_configs
            type: list
          - name: max_search_results
            type: 'int | None'
        returns:
          type: dict

  - name: ChiefEditorAgent
    entrypoint: multi_agents/agents/canyonos_chief_editor.py
    replicas: 1
    requirements: *agent_requirements
    functions:
      - name: prepare
        arguments:
          - name: query
            type: str
          - name: tone
            type: str
          - name: headers
            type: dict
        returns:
          type: dict

  - name: ResearchAgent
    entrypoint: multi_agents/agents/canyonos_researcher.py
    replicas: 1
    requirements: *agent_requirements
    functions:
      - name: run_initial_research
        arguments:
          - name: research_state
            type: dict
          - name: tone
            type: str
          - name: headers
            type: dict
        returns:
          type: dict
      - name: run_depth_research
        arguments:
          - name: draft_state
            type: dict
          - name: tone
            type: str
          - name: headers
            type: dict
        returns:
          type: dict

  - name: EditorAgent
    entrypoint: multi_agents/agents/canyonos_editor.py
    replicas: 1
    requirements: *agent_requirements
    functions:
      - name: plan_research
        arguments:
          - name: research_state
            type: dict
          - name: tone
            type: str
          - name: headers
            type: dict
        returns:
          type: dict
      - name: research_tasks
        arguments:
          - name: research_state
            type: dict
          - name: tone
            type: str
          - name: headers
            type: dict
        returns:
          type: list

  - name: HumanAgent
    entrypoint: multi_agents/agents/canyonos_human.py
    replicas: 1
    requirements: *agent_requirements
    functions:
      - name: review_plan
        arguments:
          - name: research_state
            type: dict
          - name: headers
            type: dict
        returns:
          type: dict

  - name: WriterAgent
    entrypoint: multi_agents/agents/canyonos_writer.py
    replicas: 1
    requirements: *agent_requirements
    functions:
      - name: run
        arguments:
          - name: research_state
            type: dict
          - name: headers
            type: dict
        returns:
          type: dict

  - name: FactCheckerAgent
    entrypoint: multi_agents/agents/canyonos_fact_checker.py
    replicas: 1
    requirements: *agent_requirements
    functions:
      - name: run
        arguments:
          - name: research_state
            type: dict
          - name: headers
            type: dict
        returns:
          type: dict

  - name: VisualizerAgent
    entrypoint: multi_agents/agents/canyonos_visualizer.py
    replicas: 1
    requirements: *agent_requirements
    functions:
      - name: run
        arguments:
          - name: research_state
            type: dict
          - name: headers
            type: dict
        returns:
          type: dict

  - name: PublisherAgent
    entrypoint: multi_agents/agents/canyonos_publisher.py
    replicas: 1
    requirements: *agent_requirements
    functions:
      - name: run
        arguments:
          - name: research_state
            type: dict
          - name: output_dir
            type: str
          - name: headers
            type: dict
        returns:
          type: dict

  - name: ReviewerAgent
    entrypoint: multi_agents/agents/canyonos_reviewer.py
    replicas: 1
    requirements: *agent_requirements
    functions:
      - name: run
        arguments:
          - name: draft_state
            type: dict
          - name: headers
            type: dict
        returns:
          type: dict

  - name: ReviserAgent
    entrypoint: multi_agents/agents/canyonos_reviser.py
    replicas: 1
    requirements: *agent_requirements
    functions:
      - name: run
        arguments:
          - name: draft_state
            type: dict
          - name: headers
            type: dict
        returns:
          type: dict

  - name: Workflow
    entrypoint: canyonos_workflow.py
    replicas: 1
    requirements: []
    functions:
      - name: main
        arguments:
          - name: query
            type: str
        returns:
          type: dict

endpoint:
  api_port: 8080
  agent: Workflow
  method: main

poll_interval: 5

redis:
  host: localhost
  port: 6379
  db: 0


otel:
  destinations:
    - name: local
      protocol: http
      endpoint: http://host.docker.internal:3000
      headers: {}
