agent:
  name: GPTResearcher
  functions:
    - name: run
      description: "Run one research report (every report type except multi_agents), as backend.server.app.write_report does."
      arguments:
        - name: task
          type: str
        - name: report_type
          type: str
        - name: report_source
          type: str
        - name: tone
          type: str
        - name: source_urls
          type: list
        - name: document_urls
          type: list
        - name: query_domains
          type: list
        - name: headers
          type: dict
        - name: mcp_enabled
          type: bool
        - name: mcp_strategy
          type: str
        - name: mcp_configs
          type: list
        - name: max_search_results
          type: 'int | None'
      returns:
        type: dict
