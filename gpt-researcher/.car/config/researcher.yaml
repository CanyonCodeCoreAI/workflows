agent:
  name: ResearchAgent
  functions:
    - name: run_initial_research
      description: "Graph node 'browser'."
      arguments:
        - name: research_state
          type: dict
        - name: tone
          type: str
        - name: headers
          type: dict
      returns:
        type: dict
    - name: run_depth_research
      description: "Draft graph node 'researcher'."
      arguments:
        - name: draft_state
          type: dict
        - name: tone
          type: str
        - name: headers
          type: dict
      returns:
        type: dict
